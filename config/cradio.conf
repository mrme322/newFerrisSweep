# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
CONFIG_ZMK_EXT_POWER=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

#uncoment if problems with WIFI
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# zmk studio
CONFIG_ZMK_STUDIO=y

#Para mac reconozca caps
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=n
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y


### POWER OPTIONS
# min soft sleep
CONFIG_ZMK_IDLE_TIMEOUT=60000  
# deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000  
CONFIG_ZMK_SLEEP=y

CONFIG_ZMK_POINTING=n

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10


CONFIG_BT_BAS=n
